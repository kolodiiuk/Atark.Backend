version: '3.8'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d atark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Secret: "${JWT_SECRET}"
      TokenOptions__TokenExpirationMinutes: "${TOKEN_OPTIONS_TOKEN_EXPIRATION_MINUTES}"
      TokenOptions__RefreshTokenExpirationDays: "${TOKEN_OPTIONS_REFRESH_TOKEN_EXPIRATION_DAYS}"
      GoogleAuth__ClientId: "${GOOGLE_AUTH_CLIENT_ID}"
      GoogleAuth__ClientSecret: "${GOOGLE_CLIENT_SECRET}"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - webnet

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/:/etc/nginx/conf.d/:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - webnet

volumes:
  pgdata:

networks:
  webnet:
