apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: spotrent
data:
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__DefaultConnection: >
    Host=postgres;Port=5432;Database=spotrent;
    Username=spotrent;Password=spotrent123;
    Maximum Pool Size=20;Connection Idle Lifetime=60

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotrent-api
  namespace: spotrent
spec:
  replicas: 1          # change this to scale
  selector:
    matchLabels:
      app: spotrent-api
  template:
    metadata:
      labels:
        app: spotrent-api
    spec:
      containers:
      - name: api
        image: spotrent-api:latest
        imagePullPolicy: Never    # local minikube image
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: api-config
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: spotrent-api
  namespace: spotrent
spec:
  type: NodePort
  selector:
    app: spotrent-api
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
