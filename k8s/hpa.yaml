apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spotrent-api-hpa
  namespace: spotrent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spotrent-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
